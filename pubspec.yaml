name: is_loop_launcher
description: >-
  Launches each journey path's agent loop: it subscribes to the record for
  the docking station's admissions that start a journey path, hands the path a loop
  user and a suit from their pools, records that handout, and
  starts the path's loop with the sign-ins its rules allow.
version: 0.1.0-dev
repository: https://github.com/intersyntactic/loop_launcher
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  checked_json: ^0.2.1
  is_airlock_api: ^0.5.0
  is_docking_station:
    git:
      url: https://github.com/intersyntactic/docking_station.git
      ref: c4d6c39cd812ec60982215739aacf343498ccbe7
  is_journal: ^0.7.0
  is_journal_client: ^0.1.0
  is_shapes: ^0.4.4

dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0
