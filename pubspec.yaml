name: is_loop_launcher
description: >-
  Starts each trajectory's agent loop: it follows the logbook for the docking
  station's admissions that start a trajectory, hands the trajectory a loop
  user and a suit from their pools, records that, and starts its loop.
version: 0.1.0-dev
repository: https://github.com/intersyntactic/loop_launcher
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  checked_json: ^0.2.1
  is_airlock_api: ^0.9.0
  is_docking_station:
    git:
      url: https://github.com/intersyntactic/docking_station.git
      ref: 8b7a886582b0149d4cf79b1c5d782a0fb8a6a685
  is_effects: ^0.7.0
  is_flight_rules: 0.1.0
  is_logbook: ^0.2.0
  is_logbook_client: ^0.2.0
  is_shapes: '>=0.5.0 <0.7.0'

dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0
