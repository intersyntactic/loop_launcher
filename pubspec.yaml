name: is_loop_launcher
description: >-
  Starts each trajectory's agent loop: it follows the logbook for the docking
  station's admissions that start a trajectory, hands the trajectory a loop
  user and a suit from their pools, records that, and starts its loop.
version: 0.1.0-dev
repository: https://github.com/intersyntactic/loop_launcher
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  checked_json: ^0.2.1
  # Swap for `^0.9.0` once pub.dev's listing shows it.
  is_airlock_api:
    git:
      url: https://github.com/intersyntactic/airlock_api.git
      ref: v0.9.0
  is_docking_station:
    git:
      url: https://github.com/intersyntactic/docking_station.git
      ref: d8f1cf4f1e926f5b1b5d4b3af83231b102373455
  is_effects: ^0.7.0
  is_flight_rules: 0.1.0
  is_logbook: ^0.2.0
  # Swap for `^0.2.0` once is_logbook_client 0.2.0 is on pub.dev.
  is_logbook_client:
    git:
      url: https://github.com/intersyntactic/logbook_client.git
      ref: fcb4c498f8213d49b500d61a14925e8eb46dc624
  is_shapes: ^0.5.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0
