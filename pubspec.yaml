name: is_loop_launcher
description: >-
  Launches each journey path's agent loop: it subscribes to the record for
  the docking station's admissions that start a journey path, hands the path a loop
  user and a journey user from their pools, tells the airlock the path
  started, and starts the path's loop with the token it is given back.
version: 0.1.0-dev
repository: https://github.com/intersyntactic/loop_launcher
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  agent_loop:
    git:
      url: https://github.com/intersyntactic/agent_loop.git
      ref: 207690a
  checked_json: ^0.2.1
  is_airlock_api:
    git:
      url: https://github.com/intersyntactic/airlock_api.git
      ref: dbf9a44b9b7b8eb467b4df24f017a01fbe9e7c59
  is_docking_station:
    git:
      url: https://github.com/intersyntactic/docking_station.git
      ref: d660d34f37a3902c5b96d5fcd22f29ea3040f665
  is_journal: ^0.5.0
  is_shapes: ^0.4.4

dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0
