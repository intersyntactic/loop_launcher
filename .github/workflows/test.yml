name: test

# On Linux only, where loop_launcher runs. Its tests bind real Unix sockets
# for the loop feeds but never read the peer's credentials, so macOS would
# check nothing more. Weekly as well, because what the tests check can break
# with no change here: a new runner image or a new Dart SDK.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 20 * * 0'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: dart test
